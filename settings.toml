[base]
log_level = "DEBUG"
debug = false
collect = true
resolution = "1080p"          # 桌面+游戏均为1920x1080

# ===== 按键绑定 =====
"飞升按键" = "x"
"超能按键" = "f"
"近战按键" = "c"
"手雷按键" = "q"
"终结技按键" = "g"
"主武器按键" = "1"
"副武器按键" = "2"
"重武器按键" = "3"
"插旗按键" = "e"


[1080p]
# ===== 阶段1: 飞升 (基于 888...888.rec) =====
"飞升后等待" = 1.6                    # X→S后退间隔, 录制: 1.578s

# ===== 阶段2: 两次瞄准 (仅此两处有鼠标移动) =====
"第一次ADS偏移" = [-2540, 50]
"近战前等待" = 0.5                   # ADS瞄准后→C近战前额外等待(s), 等怪出现
"第一次ADS后等待" = 2.5            # 近战释放→超能前瞄准间隔(s)
"超能前瞄准偏移" = [-360, 81]
"超能后等待" = 1.8                  # F→冲刺间隔(s), 录制: 1.687s

# ===== 阶段2: 冲刺+终结 =====
"冲刺A时间" = 0.1                    # 冲刺前A侧移持续时间(s), 录制: 0.125s
"冲刺瞄准偏移" = [280, 0]
"冲刺到终结时间" = 0             # 冲刺→G终结间隔(s), 录制: 0.156s
"终结后等待" = 3.0                    # G后等待(s)

# ===== 全局 =====
"团灭后等待时间" = 12.0
"等待Boss死亡最长时间" = 30.0
"等待Boss死亡" = 12.0
"跑离Boss时间" = 7.5
"打开菜单后等待" = 20.0
"更改角色后等待" = 5.0
"登录后等待" = 30.0
"更改角色坐标" = [538, 450]            # 1080p: 1440p坐标×0.75
"登录坐标" = [928, 485]                # 1080p: 1440p坐标×0.75
"重置进度前进时间" = 4.0
"重开后等待时间" = 3.0


[1440p]
# ===== 阶段1: 飞升 (基于 888...888.rec) =====
"飞升后等待" = 1.6                    # X→S后退间隔, 录制: 1.578s

# ===== 阶段2: 两次瞄准 (仅此两处有鼠标移动) =====
"第一次ADS偏移" = [-1512, 33]         # ① C近战前瞄准(px), 录制实测
"近战前等待" = 0.0                   # ADS瞄准后→C近战前额外等待(s), 等怪出现
"第一次ADS后等待" = 2.3             # 近战释放→超能前瞄准间隔(s)
"超能前瞄准偏移" = [265, 23]          # ② F超能前瞄准(px), 录制实测
"超能后等待" = 1.687                  # F→冲刺间隔(s), 录制: 1.687s

# ===== 阶段2: 冲刺+终结 =====
"冲刺A时间" = 0.125                    # 冲刺前A侧移持续时间(s), 录制: 0.125s
"冲刺瞄准偏移" = [0, 0]                # 冲刺中鼠标微调(px), 可调
"冲刺到终结时间" = 0.156              # 冲刺→G终结间隔(s), 录制: 0.156s
"终结后等待" = 3.0                    # G后等待(s)

# ===== 全局 =====
"团灭后等待时间" = 12.0
"等待Boss死亡最长时间" = 30.0
"等待Boss死亡" = 12.0
"跑离Boss时间" = 7.5
"打开菜单后等待" = 20.0
"更改角色后等待" = 5.0
"登录后等待" = 30.0
"更改角色坐标" = [717, 600]
"登录坐标" = [1237, 647]
"重置进度前进时间" = 4.0
"重开后等待时间" = 3.0
